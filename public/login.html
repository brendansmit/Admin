<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InkHeron Admin Login</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #202327;
        --muted: #6a7178;
        --line: #dfe3e0;
        --accent: #1d6f62;
        --accent-strong: #164f47;
        --warn: #9d4b24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #10231f;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .login-shell {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 20px;
      }

      .login-panel {
        display: grid;
        width: min(100%, 420px);
        gap: 14px;
        border: 1px solid #2d473f;
        border-radius: 8px;
        background: #fff;
        padding: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        color: var(--ink);
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 8px;
        background: #d8ebe5;
        color: #10231f;
        font-weight: 800;
      }

      .brand span:last-child {
        display: block;
        color: var(--muted);
        font-size: 0.9rem;
      }

      h1 {
        font-size: 1.55rem;
        margin: 0;
      }

      label {
        display: block;
        color: var(--muted);
        font-weight: 700;
        margin-bottom: 8px;
      }

      button,
      input {
        font: inherit;
      }

      input {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 12px;
      }

      button {
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        padding: 0 16px;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-strong);
      }

      .login-error {
        min-height: 22px;
        color: var(--warn);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <form class="login-panel" id="loginForm">
        <div class="brand">
          <span class="brand-mark">IH</span>
          <div>
            <strong>InkHeron</strong>
            <span>Admin</span>
          </div>
        </div>
        <h1>Admin login</h1>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        </div>
        <button type="submit">Log in</button>
        <p class="login-error" id="loginError" role="alert"></p>
      </form>
    </main>
    <script type="module">
      const loginForm = document.querySelector("#loginForm");
      const loginError = document.querySelector("#loginError");

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        loginError.textContent = "";
        const password = new FormData(loginForm).get("password");

        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ password })
        });

        if (!response.ok) {
          loginError.textContent = "Wrong password";
          return;
        }

        window.location.href = "/";
      });
    </script>
  </body>
</html>
